schema: spec-driven
context: |
  Project: shitaku (npm package @jsisques/shitaku).
  Purpose: CLI that installs portable AI agent setups (skills, MCPs) via npx.
  Stack: Node >=22, TypeScript 7 (ESM, strict, NodeNext, verbatimModuleSyntax), commander, @clack/prompts, zod.
  Architecture: hexagonal (ports and adapters) under src/: domain, application, ports,
  adapters/{catalog,claude-code,cli,fs}. Boundaries are enforced by test/architecture.test.ts.
  Path aliases: "@/" (src) and "@test/" (test).
  Conventions: prettier (printWidth 120, singleQuote, trailingComma all), conventional commits (commitlint),
  husky (pre-commit lint-staged; pre-push typecheck, test:changed, build).
  Artifacts language: English.
strict_tdd: true
strict_tdd_note: >
  Workspace-level test command exists: "npm test" (vitest run).
projects: []
testing:
  runner: vitest
  command: npm test
  layers:
    unit: true
    integration: false
    e2e: false
  coverage: false
  linter: null
  type_checker: npm run typecheck
  formatter: npm run format:check
rules:
  proposal:
    - Include rollback plan and affected hexagonal layers
  specs:
    - Use Given/When/Then scenarios
  design:
    - Keep domain free of infrastructure imports; depend through ports
  tasks:
    - Forecast the 400-line review budget
  apply:
    - Follow hexagonal boundaries; write tests first (strict TDD)
  verify:
    - Run npm test, npm run typecheck and npm run format:check
  archive:
    - Merge delta specs into openspec/specs before archiving
