name: Bug report
description: Report something that is not working as expected
labels: ['bug']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands or steps that trigger the bug.
      placeholder: |
        1. Run `dotagent ...`
        2. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: dotagent version, Node.js version and OS.
      placeholder: dotagent 0.1.0, Node 22, macOS 15
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that defines when the bug is fixed.
      value: |
        - [ ]
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Logs, screenshots or links.
